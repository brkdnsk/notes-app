# 1. Sunucunun Çalışacağı Port Numarası
server.port=8080

# 2. PostgreSQL Veritabanı Bağlantı Adresi (notes_db adında bir veritabanına bağlanıyoruz)
spring.datasource.url=jdbc:postgresql://localhost:5432/notes_db
spring.datasource.username=postgres
spring.datasource.password=BURAYA_POSTGRESQL_SIFRENIZI_YAZIN

# 3. Hibernate / JPA Ayarları (Veritabanı Tablolarını Otomatik Yönetme)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true